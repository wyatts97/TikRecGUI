<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ef4444'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikRec WebUI</title>
    <!--
      Applied before first paint. The theme is otherwise stamped by
      ThemeProvider in a useEffect, which runs after hydration -- so every load
      flashed the light theme first. This mirrors useTheme.tsx's resolution
      exactly; keep the two in sync. The accent is read from a resolved cache
      that applyAccent() writes, so the preset table lives in one place.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('tikrec-theme')
          if (theme !== 'light' && theme !== 'dark' && theme !== 'neo-futurism') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (theme === 'light') {
            root.classList.add('light')
          } else if (theme === 'dark') {
            root.classList.add('dark')
          } else {
            root.classList.add('dark')
            root.setAttribute('data-theme', 'theme-neo-futurism')
          }

          var resolved = localStorage.getItem('tikrec-accent-resolved')
          if (resolved) {
            var parts = JSON.parse(resolved)
            if (parts && parts.primary) {
              root.style.setProperty('--primary', parts.primary)
              root.style.setProperty('--primary-border', parts.border || parts.primary)
            }
          }
        } catch (e) {
          /* Private mode / disabled storage: fall through to the default theme. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
